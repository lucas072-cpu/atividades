<section class="cadastro" aria-label="Cadastro de voluntário">
  <h2>Cadastre-se</h2>
  <p>Preencha os dados abaixo para entrar em contato com a ONG.</p>

  <form action="#" method="post">
    <fieldset>
      <legend>Informações pessoais</legend>

      <label for="nome">Nome completo:</label>
      <input type="text" id="nome" name="nome" required />

      <label for="email">E-mail:</label>
      <input type="email" id="email" name="email" required />

      <label for="nascimento">Data de nascimento:</label>
      <input type="date" id="nascimento" name="nascimento" required />

      <label for="cpf">CPF:</label>
      <input type="text" id="cpf" name="cpf" pattern="[0-9]{3}.[0-9]{3}.[0-9]{3}-[0-9]{2}" title="Digite o CPF no formato 000.000.000-00" required />

      <label for="telefone">Telefone:</label>
      <input type="tel" id="telefone" name="telefone" pattern="\(\d{2}\)\s\d{4,5}-\d{4}" title="Digite no formato (XX) 9XXXX-XXXX ou (XX) XXXX-XXXX" required />
    </fieldset>

    <fieldset>
      <legend>Endereço</legend>

      <label for="cep">CEP:</label>
      <input type="text" id="cep" name="cep" pattern="[0-9]{5}-[0-9]{3}" title="Digite o CEP no formato 00000-000" required />

      <label for="endereco">Endereço:</label>
      <input type="text" id="endereco" name="endereco" required />

      <label for="numero">Número:</label>
      <input type="number" id="numero" name="numero" required />

      <label for="cidade">Cidade:</label>
      <input type="text" id="cidade" name="cidade" required />

      <label for="estado">Estado:</label>
      <select id="estado" name="estado" required>
        <option value="">Selecione</option>
        <option value="SP">São Paulo</option>
        <option value="RJ">Rio de Janeiro</option>
        <option value="MG">Minas Gerais</option>
        <option value="PR">Paraná</option>
      </select>
    </fieldset>

    <button type="submit">Enviar cadastro</button>
  </form>
</section>
